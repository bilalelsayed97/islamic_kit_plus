name: islamic_kit_plus
description: >-
  Offline Islamic toolkit for Flutter: prayer times, next prayer, Hijri calendar
  (4 methods), qibla, calendars and an offline city geocoder (bundled 265k-place
  SQLite database). Meeus solar algorithm, an aladhan-compatible JSON model and
  English/Arabic localization.
version: 0.3.1
repository: https://github.com/bilalelsayed97/islamic_kit_plus
issue_tracker: https://github.com/bilalelsayed97/islamic_kit_plus/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Geocoding reads the bundled city database. The rest of the package
  # (prayer times, Hijri calendar, qibla) uses only dart:core + dart:math.
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/prayer_times.db
